# =============================================================================
# WISMO Agent. Konfiguracja reverse proxy.
# Prod: dodaj block server na 443 z certbotem, redirect z 80 na 443.
# =============================================================================

upstream n8n_backend {
    server n8n:5678;
    keepalive 32;
}

upstream wismo_api_backend {
    server wismo-api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Webhooki agenta z kanałów zewnętrznych
    location /webhook/ {
        limit_req zone=widget burst=10 nodelay;
        proxy_pass http://n8n_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Panel administracyjny n8n (produkcyjnie za VPN lub allowlist IP)
    location /n8n/ {
        # allow 203.0.113.0/24;  # przykład, dostosuj do biura
        # deny all;
        proxy_pass http://n8n_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # API guardraili
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://wismo_api_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
